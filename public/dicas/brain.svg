<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 405" role="img" aria-labelledby="title"><title id="title">Mapa do encéfalo: telencéfalo, diencéfalo, tronco e cerebelo</title><g font-family="Avenir Next, Segoe UI, sans-serif"><rect x="25" y="20" width="295" height="53" rx="9" fill="#dceaf1"/><text x="42" y="44" fill="#183648" font-size="17">Telencéfalo: hemisférios</text><text x="42" y="63" fill="#183648" font-size="15">Diencéfalo fica profundo</text><rect x="65" y="91" width="220" height="42" rx="9" fill="#b9d8cc"/><text x="80" y="118" fill="#183648" font-size="17">Diencéfalo</text><path d="M176 73L176 91" stroke="#183648" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M176 133L176 150" stroke="#183648" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="65" y="151" width="220" height="42" rx="9" fill="#dceaf1"/><text x="80" y="178" fill="#183648" font-size="17">Mesencéfalo</text><rect x="65" y="201" width="220" height="42" rx="9" fill="#bcd3df"/><text x="80" y="228" fill="#183648" font-size="17">Ponte</text><rect x="65" y="251" width="220" height="42" rx="9" fill="#dceaf1"/><text x="80" y="278" fill="#183648" font-size="17">Bulbo</text><path d="M176 293L176 324" stroke="#183648" stroke-width="2" fill="none" stroke-dasharray=""/><text x="107" y="346" fill="#183648" font-size="17">Medula espinal</text><rect x="372" y="188" width="200" height="87" rx="9" fill="#eac9b9"/><text x="396" y="224" fill="#183648" font-size="17">Cerebelo</text><text x="391" y="249" fill="#183648" font-size="15">Folhas estreitas</text><path d="M285 222L372 222" stroke="#183648" stroke-width="2" fill="none" stroke-dasharray=""/><text x="35" y="384" fill="#183648" font-size="15">Tronco: à frente do cerebelo. Mapa de relações, sem escala.</text></g></svg>