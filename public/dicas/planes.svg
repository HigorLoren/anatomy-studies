<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title"><title id="title">Planos verticais em blocos: sagital separa direita e esquerda; coronal separa frente e costas</title><g font-family="Avenir Next, Segoe UI, sans-serif" fill="#183648" font-size="17"><text x="75" y="28">Sagital</text><text x="356" y="28">Coronal / frontal</text><g fill="#dceaf1" stroke="#183648" stroke-width="1.5"><path d="M65 90L110 55H240V186L195 221H65Z"/><path d="M65 90H195V221M195 90L240 55M65 90L110 55"/><path d="M355 90L400 55H530V186L485 221H355Z"/><path d="M355 90H485V221M485 90L530 55M355 90L400 55"/></g><g fill="#99c5bd" fill-opacity=".85" stroke="#138078" stroke-width="2"><path d="M130 80L175 45V206L130 241Z"/><path d="M372 76H512V210H372Z"/></g><text x="63" y="269">Direita | esquerda</text><text x="354" y="269">Anterior | posterior</text><text x="60" y="295" font-size="14">Blocos representam o corpo. Os dois planos são verticais.</text></g></svg>